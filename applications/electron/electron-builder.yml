appId: com.atypisch.soriku.ide
productName: SorikuIDE
copyright: Copyright © 2026 Atypisch
electronDist: ../../node_modules/electron/dist
electronVersion: 39.8.7
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# Top-level (not mac-only): electron-builder generates the matching
# registration for every target from this one block — macOS Info.plist,
# Windows NSIS registry entry, Linux .desktop MimeType. Drives the
# `soriku://auth-callback#token=…` deep link (Fase 6); must match
# applications/electron/package.json's theia.frontend.config.electron.uriScheme.
protocols:
  - name: soriku
    schemes:
      - soriku

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/icons/WindowIcon/512-512.png
  - resources/TheiaIDESplash.svg
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins

win:
  icon: resources/icons/WindowsLauncherIcons/TheiaIDE.ico
  target:
    - nsis
  publish:
    provider: generic
    url: "https://soriku.com/downloads/ide/stable/windows"
    useMultipleRangeRequest: false
mac:
  icon: resources/icons/MacLauncherIcons/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - dmg
    - zip
  publish:
    provider: generic
    # Default arch path; scripts/release-desktop.sh overrides this per build
    # (`--config.mac.publish.url=…/macos-arm`) for the arm64 pass, matching
    # the updater's separate macos/macos-arm feed URLs.
    url: "https://soriku.com/downloads/ide/stable/macos"
  # Real signing/notarization (electron-builder's built-in flow, not a custom
  # script): active only when CSC_LINK/CSC_KEY_PASSWORD (signing) and
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID (notarization) are set
  # in the environment. `yarn package:preview` still forces
  # `-c.mac.identity=null` for unsigned local dev builds.
  hardenedRuntime: true
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  # electron-builder 26's schema: this is a boolean, not {teamId}. Credentials
  # are 100% environment-driven — electron-builder auto-notarizes whenever one
  # of these env-var sets is present: APPLE_API_KEY+APPLE_API_KEY_ID+
  # APPLE_API_ISSUER, or APPLE_ID+APPLE_APP_SPECIFIC_PASSWORD+APPLE_TEAM_ID, or
  # APPLE_KEYCHAIN+APPLE_KEYCHAIN_PROFILE. `notarize: true` just keeps it from
  # being silently skipped; it still no-ops without real credentials in env.
  notarize: true
linux:
  icon: resources/icons/LinuxLauncherIcons
  category: Development
  mimeTypes:
    - inode/directory
  vendor: Atypisch
  target:
    - deb
    - AppImage
  publish:
    provider: generic
    url: "https://soriku.com/downloads/ide/stable/linux"

nsis:
  menuCategory: true
  oneClick: false
  perMachine: false
  installerHeaderIcon: resources/icons/WindowsLauncherIcons/TheiaIDE.ico
  installerIcon: resources/icons/WindowsLauncherIcons/TheiaIDE.ico
  uninstallerIcon: resources/icons/WindowsLauncherIcons/TheiaIDE.ico
  installerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  uninstallerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: Soriku-IDE-${version}-${arch}.${ext}
  license: LICENSE
dmg:
  artifactName: Soriku-IDE-${version}-${arch}.${ext}
deb:
  artifactName: Soriku-IDE-${version}-${arch}.${ext}
appImage:
  artifactName: Soriku-IDE-${version}-${arch}.${ext}

afterPack: ./scripts/after-pack.js
